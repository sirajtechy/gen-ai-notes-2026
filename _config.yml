title: GenAI Engineering Notes
description: >-
  Curated notes from the DS25 & GenAI live cohort (Inceptez Technologies) —
  RAG, retrieval, evaluation, LangGraph, multi-agent systems, MCP, and deep agents.
baseurl: "/gen-ai-notes-2026"
url: ""

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: dark

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_sort: case_sensitive
heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: "Notes compiled from personal course transcripts — DS25 & GenAI cohort, Inceptez Technologies."

aux_links:
  "Course transcripts (source)":
    - "#"

aux_links_new_tab: false

callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: purple
  warning:
    title: Watch out
    color: red
  interview:
    title: Interview angle
    color: green

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

title: GenAI Engineering Notes
tagline: Field notes from a live GenAI engineering cohort
description: >-
  Curated, diagram-driven notes from the DS25 & GenAI live cohort
  (Inceptez Technologies) — RAG, retrieval, evaluation, production memory,
  guardrails, LangGraph, multi-agent systems, MCP, and Deep Agents.
author: Siraj

# Project site served at https://sirajtechy.github.io/gen-ai-notes-2026/
baseurl: "/gen-ai-notes-2026"
url: "https://sirajtechy.github.io"

# Custom theme lives in _layouts / _includes / assets — no remote_theme.
plugins:
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Reading-time estimate assumes ~200 wpm.
words_per_minute: 200

# GitHub link shown in the top bar.
repo_url: "https://github.com/sirajtechy/gen-ai-notes-2026"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
